<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Market Trade</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: url("{{ url_for('static', filename='bg.jpg') }}") no-repeat center center fixed; background-size: cover; padding: 30px; }
        .card { max-width: 600px; margin: 40px auto; background: rgba(255,255,255,0.95); padding: 24px; border-radius: 12px; border: 1px solid rgba(39,174,96,0.1); }
        label { display:block; margin:10px 0 6px; font-weight:600 }
        input, select, textarea { width:100%; padding:10px; border-radius:6px; border:1px solid #ddd }
        button { margin-top:12px; padding:12px 20px; background:linear-gradient(135deg,#27ae60,#2ecc71); color:white; border:none; border-radius:8px; font-weight:700 }
    </style>
</head>
<body>
<div class="card">
    <h2>💱 Market Trade (Simulator)</h2>
    <p>Place a mock trade on a market instrument (skill/industry). This is a simulator and does not execute real trades.</p>

    <form method="post" action="/trade">
        <label for="action">Action</label>
        <select id="action" name="action" required>
            <option value="buy">Buy</option>
            <option value="sell">Sell</option>
        </select>

        <label for="instrument">Instrument (skill or industry)</label>
        <input id="instrument" name="instrument" placeholder="e.g., Python or FinTech" required>

        <label for="quantity">Quantity</label>
        <input id="quantity" name="quantity" type="number" min="1" value="1" required>

        <label for="notes">Notes (optional)</label>
        <textarea id="notes" name="notes" rows="3"></textarea>

        <button type="submit">Execute Trade</button>
    </form>

    <p style="margin-top:12px; font-size:13px; color:#666">Trades are recorded to `data/trades.csv` on the server.</p>

    <p style="margin-top:12px;"><a href="/dashboard">← Back to Dashboard</a></p>
</div>
</body>
</html>

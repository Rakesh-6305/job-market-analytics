<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Trade Result</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: url("{{ url_for('static', filename='bg.jpg') }}") no-repeat center center fixed; background-size: cover; padding: 30px; }
        .card { max-width: 600px; margin: 40px auto; background: rgba(255,255,255,0.95); padding: 24px; border-radius: 12px; border: 1px solid rgba(39,174,96,0.1); text-align:center }
        .ok { font-size: 48px; }
        .meta { margin-top:10px; color:#444 }
        a { display:inline-block; margin-top:16px; padding:8px 14px; background:linear-gradient(135deg,#27ae60,#2ecc71); color:white; border-radius:8px; text-decoration:none }
    </style>
</head>
<body>
<div class="card">
    <div class="ok">✅</div>
    <h2>Trade Executed (Simulated)</h2>
    <p class="meta">Action: <strong>{{ action }}</strong></p>
    <p class="meta">Instrument: <strong>{{ instrument }}</strong></p>
    <p class="meta">Quantity: <strong>{{ quantity }}</strong></p>
    <p class="meta">Time (UTC): <strong>{{ timestamp }}</strong></p>

    <a href="/dashboard">View Dashboard</a>
</div>
</body>
</html>

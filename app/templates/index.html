<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Market Analytics</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url("{{ url_for('static', filename='bg.jpg') }}") no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .header h1 {
            font-size: 42px;
            margin-bottom: 10px;
            animation: slideDown 0.6s ease;
        }

        .header p {
            font-size: 18px;
            opacity: 0.95;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .card {
            max-width: 500px;
            margin: 0 auto;
            padding: 40px;
            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            border: 2px solid rgba(39, 174, 96, 0.2);
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .card h2 {
            color: #27ae60;
            margin-bottom: 30px;
            text-align: center;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            margin: 0;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #27ae60;
            box-shadow: 0 0 0 3px rgba(39, 174, 96, 0.1);
            background-color: #f9fff9;
        }

        input::placeholder {
            color: #999;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(39, 174, 96, 0.4);
        }

        button:hover {
            background: linear-gradient(135deg, #229954, #27ae60);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(39, 174, 96, 0.5);
        }

        button:active {
            transform: translateY(0);
        }

        .info-box {
            background: rgba(52, 152, 219, 0.1);
            border-left: 4px solid #3498db;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            color: #2c3e50;
            font-size: 13px;
            line-height: 1.6;
        }

        /* Feature Cards */
        .features {
            margin-top: 40px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .feature-item {
            background: linear-gradient(135deg, rgba(39, 174, 96, 0.1), rgba(46, 204, 113, 0.05));
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(39, 174, 96, 0.2);
            transition: all 0.3s ease;
            animation: fadeInUp 0.6s ease backwards;
        }

        .feature-item:nth-child(1) { animation-delay: 0.1s; }
        .feature-item:nth-child(2) { animation-delay: 0.2s; }
        .feature-item:nth-child(3) { animation-delay: 0.3s; }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .feature-item:hover {
            background: linear-gradient(135deg, rgba(39, 174, 96, 0.2), rgba(46, 204, 113, 0.1));
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(39, 174, 96, 0.2);
        }

        .feature-icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .feature-title {
            font-size: 14px;
            font-weight: 600;
            color: #27ae60;
        }

        .form-group label {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon-circle {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }
    </style>
</head>


<body>

<!-- 3D Background Animation -->
<div id="canvas-container" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1; pointer-events: none;">
    <canvas id="bg-canvas"></canvas>
</div>

<div class="container">
    <div class="header">
        <h1>📊 Job Market Analytics</h1>
        <p>Analyze job demand and discover your career opportunities</p>
    </div>

    <div class="card">
        <h2>🎯 Analyze Your Skills</h2>

        <form action="/predict" method="post">
            <div class="form-group">
                <label for="skills"><span class="icon-circle">1</span> 💻 Your Skills</label>
                <input type="text" id="skills" name="skills" placeholder="e.g., python, machine learning, sql" required>
            </div>

            <div class="form-group">
                <label for="location"><span class="icon-circle">2</span> 📍 Preferred Location</label>
                <select id="location" name="location" required>
                    <option value="">Select a location</option>
                    {% for l in locations %}
                    <option value="{{l}}">{{l}}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="industry"><span class="icon-circle">3</span> 🏢 Industry</label>
                <select id="industry" name="industry" required>
                    <option value="">Select an industry</option>
                    {% for i in industries %}
                    <option value="{{i}}">{{i}}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="experience"><span class="icon-circle">4</span> ⏱️ Years of Experience</label>
                <input type="number" id="experience" name="experience" min="0" max="20" placeholder="0-20 years" required>
            </div>

            <div class="form-group">
                <label for="salary"><span class="icon-circle">5</span> 💰 Expected Salary (LPA)</label>
                <input type="number" id="salary" name="salary" min="2" max="50" placeholder="2-50 LPA" required>
            </div>

            <button type="submit">🚀 Predict Job Demand</button>
        </form>

        <div class="info-box">
            ℹ️ <strong>Tip:</strong> Fill in all fields accurately to get the best job market insights and recommendations.
        </div>

        <div class="features">
            <div class="feature-item">
                <div class="feature-icon">📊</div>
                <div class="feature-title">Data Analytics</div>
            </div>
            <div class="feature-item">
                <div class="feature-icon">🎯</div>
                <div class="feature-title">Accurate Predictions</div>
            </div>
            <div class="feature-item">
                <div class="feature-icon">📈</div>
                <div class="feature-title">Market Trends</div>
            </div>
        </div>
    </div>
</div>

<!-- Three.js Library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="{{ url_for('static', filename='animation.js') }}"></script>

</body>

</html>
